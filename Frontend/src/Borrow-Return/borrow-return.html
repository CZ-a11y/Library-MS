<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNest - Borrow/Return</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="dashboard">
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="logo">
          <i class="fas fa-book"></i>
          <span>BookNest</span>
        </div>
        <ul class="menu" id="menuList">
          <li>
            <i class="fas fa-th-large"></i>
            <a href="#Admin-Dashboard" data-link>Dashboard</a>
          </li>
          <li>
            <i class="fas fa-book"></i>
            <a href="#Books" data-link>Books</a>
          </li>
          <li>
            <i class="fas fa-users"></i>
            <a href="#Members" data-link>Members</a>
          </li>
          <li class="active">
            <i class="fas fa-exchange-alt"></i>
            <a href="#Borrow-Return" data-link>Borrow / Return</a>
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="menu-toggle"
              id="menuToggle"
              aria-label="Toggle Menu"
            >
              <i class="fas fa-bars"></i>
            </button>
            <h2>Borrow / Return</h2>
          </div>
          <div class="search-add">
            <div class="search-bar">
              <input
                type="text"
                id="searchInput"
                placeholder="Search transactions..."
              />
              <i class="fas fa-search"></i>
            </div>
          </div>
        </header>

        <!-- Borrow/Return Form -->
        <section class="borrow-return-form">
          <form id="borrowReturnForm">
            <div class="form-row">
              <div class="form-group">
                <label for="member">Member:</label>
                <select id="member" required>
                  <option value="" disabled selected>Select Member</option>
                  <option value="1">John Doe</option>
                  <option value="2">Jane Smith</option>
                  <option value="3">Alice Johnson</option>
                </select>
              </div>
              <div class="form-group">
                <label for="book">Book:</label>
                <select id="book" required>
                  <option value="" disabled selected>Select Book</option>
                  <option value="1">The Great Gatsby</option>
                  <option value="2">Barwing Book</option>
                  <option value="3">The Science Basics</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="action">Action:</label>
                <select id="action" required>
                  <option value="" disabled selected>Select Action</option>
                  <option value="borrow">Borrow</option>
                  <option value="return">Return</option>
                </select>
              </div>
              <div class="form-group">
                <label for="dueDate">Due Date:</label>
                <input type="date" id="dueDate" required />
              </div>
            </div>
            <div class="form-actions">
              <button type="submit" class="submit-btn">
                <i class="fas fa-check"></i> Submit
              </button>
              <button type="reset" class="reset-btn">
                <i class="fas fa-redo"></i> Reset
              </button>
            </div>
          </form>
        </section>

        <!-- Recent Transactions -->
        <section class="recent-transactions">
          <div class="table-header">
            <h3>Recent Transactions</h3>
            <button class="export-btn" id="exportBtn">
              <i class="fas fa-file-export"></i> Export
            </button>
          </div>
          <div class="table-responsive">
            <table id="transactionsTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Member</th>
                  <th>Book</th>
                  <th>Action</th>
                  <th>Date</th>
                  <th>Due Date</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr class="fade-in">
                  <td>1</td>
                  <td>John Doe</td>
                  <td>The Great Gatsby</td>
                  <td>Borrow</td>
                  <td>2023-10-01</td>
                  <td>2023-10-15</td>
                  <td><span class="status active">Active</span></td>
                </tr>
                <tr class="fade-in">
                  <td>2</td>
                  <td>Jane Smith</td>
                  <td>Barwing Book</td>
                  <td>Return</td>
                  <td>2023-09-25</td>
                  <td>2023-10-05</td>
                  <td><span class="status returned">Returned</span></td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Load jsPDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      // Initialize jsPDF globally
      const { jsPDF } = window.jspdf;
      window.jsPDF = jsPDF;
    </script>
    <script src="borrow-return.js"></script>
  </body>
</html>
