<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookNest - Books</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="dashboard">
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="logo">
          <i class="fas fa-book"></i>
          <span>BookNest</span>
        </div>
        <ul class="menu" id="menuList">
          <li>
            <i class="fas fa-th-large"></i>
            <a href="#Admin-Dashboard" data-link>Dashboard</a>
          </li>
          <li class="active">
            <i class="fas fa-book"></i>
            <a href="#Books" data-link>Books</a>
          </li>
          <li>
            <i class="fas fa-users"></i>
            <a href="#Members" data-link>Members</a>
          </li>
          <li>
            <i class="fas fa-exchange-alt"></i>
            <a href="#Borrow-Return" data-link>Borrow / Return</a>
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="menu-toggle"
              id="menuToggle"
              aria-label="Toggle Menu"
            >
              <i class="fas fa-bars"></i>
            </button>
            <h2>Books</h2>
          </div>
          <div class="search-add">
            <div class="search-bar">
              <input
                type="text"
                id="searchInput"
                placeholder="Search books..."
              />
              <i class="fas fa-search"></i>
            </div>
            <button class="add-book-btn" id="addBookBtn">
              <i class="fas fa-plus"></i> Add Book
            </button>
          </div>
        </header>

        <!-- Books Table -->
        <section class="books-table">
          <div class="table-header">
            <h3>Book List</h3>
            <div class="table-actions">
              <button class="export-btn" id="exportBtn">
                <i class="fas fa-file-export"></i> Export
              </button>
            </div>
          </div>
          <div class="table-responsive">
            <table id="booksTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Author</th>
                  <th>Category</th>
                  <th>ISBN</th>
                  <th>Quantity</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <!-- Rows will be added dynamically -->
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- Add Book Modal -->
    <div id="addBookModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3><i class="fas fa-book-medical"></i> Add New Book</h3>
        <form id="addBookForm">
          <div class="form-group">
            <label for="addTitle">Title:</label>
            <input
              type="text"
              id="addTitle"
              placeholder="Enter book title"
              required
            />
          </div>
          <div class="form-group">
            <label for="addAuthor">Author:</label>
            <input
              type="text"
              id="addAuthor"
              placeholder="Enter author name"
              required
            />
          </div>
          <div class="form-group">
            <label for="addCategory">Category:</label>
            <select id="addCategory" required>
              <option value="" disabled selected>Select Category</option>
              <option value="Fiction">Fiction</option>
              <option value="Science">Science</option>
              <option value="History">History</option>
              <option value="Biography">Biography</option>
              <option value="Fantasy">Fantasy</option>
            </select>
          </div>
          <div class="form-group">
            <label for="addIsbn">ISBN:</label>
            <input type="text" id="addIsbn" placeholder="Enter ISBN" required />
          </div>
          <div class="form-group">
            <label for="addQuantity">Quantity:</label>
            <input
              type="number"
              id="addQuantity"
              placeholder="Enter quantity"
              required
              min="1"
            />
          </div>
          <div class="form-actions">
            <button type="submit" class="save-btn">
              <i class="fas fa-save"></i> Add Book
            </button>
            <button type="button" class="cancel-btn">
              <i class="fas fa-times"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Edit Book Modal -->
    <div id="editBookModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3><i class="fas fa-edit"></i> Edit Book</h3>
        <form id="editBookForm">
          <div class="form-group">
            <label for="editTitle">Title:</label>
            <input type="text" id="editTitle" required />
          </div>
          <div class="form-group">
            <label for="editAuthor">Author:</label>
            <input type="text" id="editAuthor" required />
          </div>
          <div class="form-group">
            <label for="editCategory">Category:</label>
            <select id="editCategory" required>
              <option value="Fiction">Fiction</option>
              <option value="Science">Science</option>
              <option value="History">History</option>
              <option value="Biography">Biography</option>
              <option value="Fantasy">Fantasy</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editIsbn">ISBN:</label>
            <input type="text" id="editIsbn" required />
          </div>
          <div class="form-group">
            <label for="editQuantity">Quantity:</label>
            <input type="number" id="editQuantity" required min="1" />
          </div>
          <div class="form-actions">
            <button type="submit" class="save-btn">
              <i class="fas fa-save"></i> Save Changes
            </button>
            <button type="button" class="cancel-btn">
              <i class="fas fa-times"></i> Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteBookModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3><i class="fas fa-trash"></i> Delete Book</h3>
        <p>
          Are you sure you want to delete this book? This action cannot be
          undone.
        </p>
        <div class="modal-actions">
          <button id="confirmDelete" class="delete-confirm-btn">
            <i class="fas fa-trash"></i> Delete
          </button>
          <button class="cancel-btn">
            <i class="fas fa-times"></i> Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Load jsPDF library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
      // Initialize jsPDF globally
      const { jsPDF } = window.jspdf;
      window.jsPDF = jsPDF;
    </script>
    <script src="books.js"></script>
  </body>
</html>
